name: "CD / Cloud Run Keyless Delivery"

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target GitHub Environment (staging or production)"
        type: choice
        options:
          - staging
          - production
        default: staging
      action:
        description: "Delivery action: deploy (build+deploy), promote (existing digest), or rollback"
        type: choice
        options:
          - deploy
          - promote
          - rollback
        default: deploy
      image_digest:
        description: "Full Artifact Registry image@sha256:... (required for promote; optional for rollback)"
        type: string
        required: false
        default: ""
      revision:
        description: "Existing Cloud Run revision name to shift 100% traffic to (for rollback)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: cd-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false

jobs:
  verify:
    name: "Verify (tests + lint)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Sync frozen environment
        run: uv sync --frozen --extra dev

      - name: Run pytest
        run: uv run pytest

      - name: Run ruff lint
        run: uv run ruff check src/ tests/ scripts/

  build-and-push:
    name: "Build & Push (SHA-tagged image)"
    needs: verify
    if: ${{ github.event_name == 'push' || (github.event.inputs.action || 'deploy') == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      image_digest: ${{ steps.push.outputs.image_digest }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC/WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${{ vars.GCP_REGION }}-docker.pkg.dev" --quiet

      - name: Build and push SHA-tagged container image
        id: push
        env:
          IMAGE_TAG: ${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_AR_REPOSITORY }}/spherex-ingest:${{ github.sha }}
        run: |
          docker build --platform linux/amd64 --tag "${IMAGE_TAG}" .
          docker push "${IMAGE_TAG}"
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "${IMAGE_TAG}")
          echo "image_digest=${DIGEST}" >> "${GITHUB_OUTPUT}"
          echo "Published immutable image: ${DIGEST}"

  deploy-or-promote:
    name: "Deploy / Promote to Cloud Run"
    needs: [verify, build-and-push]
    if: >-
      !cancelled() &&
      needs.verify.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      ((github.event.inputs.action || 'deploy') != 'rollback' || (github.event.inputs.image_digest != '' && github.event.inputs.revision == ''))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve target image digest
        id: image
        env:
          ACTION: ${{ github.event.inputs.action || 'deploy' }}
          BUILT_DIGEST: ${{ needs.build-and-push.outputs.image_digest }}
          INPUT_DIGEST: ${{ github.event.inputs.image_digest }}
          INPUT_CODE_SHA: ${{ github.event.inputs.code_sha }}
        run: |
          if [ "${ACTION}" = "deploy" ]; then
            echo "digest=${BUILT_DIGEST}" >> "${GITHUB_OUTPUT}"
            echo "code_sha=${GITHUB_SHA}" >> "${GITHUB_OUTPUT}"
          else
            if [[ -z "${INPUT_DIGEST}" || ! "${INPUT_CODE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::image_digest and its full code_sha are required"
              exit 1
            fi
            echo "digest=${INPUT_DIGEST}" >> "${GITHUB_OUTPUT}"
            echo "code_sha=${INPUT_CODE_SHA}" >> "${GITHUB_OUTPUT}"
          fi

      - name: Authenticate to Google Cloud via OIDC/WIF
        id: gcp-auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Install Astral uv for benchmark seeding
        if: ${{ (github.event.inputs.action || 'deploy') == 'deploy' }}
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Seed durable NASA benchmark cache
        if: ${{ (github.event.inputs.action || 'deploy') == 'deploy' }}
        env:
          BENCHMARK_BUCKET: ${{ vars.GCP_GCS_BUCKET || format('{0}-spherex-bundles-{1}', vars.GCP_PROJECT_ID, github.event.inputs.environment || 'staging') }}
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
        run: uv run --frozen --no-dev python scripts/seed_benchmark_cache.py "${BENCHMARK_BUCKET}"

      - name: Deploy and verify the private worker, then deploy the API
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          RUNTIME_SA: ${{ vars.GCP_RUNTIME_SERVICE_ACCOUNT }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          WORKER_SA: ${{ format('spherex-worker-{0}@{1}.iam.gserviceaccount.com', github.event.inputs.environment || 'staging', vars.GCP_PROJECT_ID) }}
          TASKS_SA: ${{ format('spherex-tasks-{0}@{1}.iam.gserviceaccount.com', github.event.inputs.environment || 'staging', vars.GCP_PROJECT_ID) }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          CODE_SHA: ${{ steps.image.outputs.code_sha }}
          BUNDLE_BUCKET: ${{ vars.GCP_GCS_BUCKET || format('{0}-spherex-bundles-{1}', vars.GCP_PROJECT_ID, github.event.inputs.environment || 'staging') }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
        run: bash deploy/gcp/deploy-services.sh

      - name: Verify live Cloud Run service (auth + health + benchmarks + gate)
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
          REQUIRE_INVOKER_IAM: ${{ vars.GCP_REQUIRE_INVOKER_IAM || 'false' }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${DEPLOY_SA}" \
            --audiences="${SERVICE_URL}")

          UNAUTH_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${SERVICE_URL}/api/v1/health")
          echo "Unauthenticated /api/v1/health -> HTTP ${UNAUTH_CODE} (require_invoker_iam=${REQUIRE_INVOKER_IAM})"
          if [ "${REQUIRE_INVOKER_IAM}" = "true" ]; then
            echo "${UNAUTH_CODE}" | grep -qE "^(401|403)$"
          else
            test "${UNAUTH_CODE}" = "200"
          fi

          curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/api/v1/health" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='ok' and d.get('revision') and d['legacy_sync_enabled'] is False, d; print('Health OK:', d['revision'])"

          curl -fsS -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/api/v1/benchmarks" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d,list) and len(d)==5, d; print('Benchmarks OK:', len(d))"

          GATE_CODE=$(curl -sS -o /dev/null -w "%{http_code}" -H "Authorization: Bearer ${ID_TOKEN}" "${SERVICE_URL}/api/v1/blink?ra=331&dec=-56")
          echo "Live-query gate -> HTTP ${GATE_CODE}"
          test "${GATE_CODE}" = "503"

      - name: Verify server cache for all five viewer requests
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${DEPLOY_SA}" --audiences="${SERVICE_URL}")
          for target in barnards_star epsilon_indi_b wise_0855_0714 rw_aurigae r_draconis; do
            curl -fsS --max-time 60 -H "Authorization: Bearer ${ID_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "{\"query\":\"${target}\",\"size_arcsec\":180,\"max_frames\":12}" \
              "${SERVICE_URL}/api/v1/jobs" \
              | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['status']=='succeeded' and d['cached'] and d['attempts']==0 and d['result']['total_frames']>0 and d['result']['target']['target_id']==sys.argv[1]; print(sys.argv[1], d['result']['total_frames'], 'cached frames')" "${target}"
          done

  deploy-viewer:
    name: "Deploy Static Viewer (GCS)"
    needs: deploy-or-promote
    if: ${{ github.event_name == 'push' || (github.event.inputs.action || 'deploy') == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage static viewer release
        run: python3 scripts/build_hosting.py

      - name: Authenticate to Google Cloud via OIDC/WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Sync static viewer to GCS bucket
        env:
          VIEWER_BUCKET: ${{ vars.GCP_VIEWER_BUCKET || format('{0}-viewer', vars.GCP_PROJECT_ID) }}
        run: |
          gcloud storage rsync \
            --recursive \
            --delete-unmatched-destination-objects \
            dist/hosting "gs://${VIEWER_BUCKET}"
          if [ -d dist/hosting/releases ]; then
            gcloud storage objects update "gs://${VIEWER_BUCKET}/releases/**" \
              --cache-control="public, max-age=31536000, immutable"
          fi
          gcloud storage objects update \
            "gs://${VIEWER_BUCKET}/index.html" \
            "gs://${VIEWER_BUCKET}/*.js" \
            "gs://${VIEWER_BUCKET}/*.css" \
            "gs://${VIEWER_BUCKET}/*.json" \
            "gs://${VIEWER_BUCKET}/sky/sky.json" \
            --cache-control="no-cache"

      - name: Verify live public static viewer
        env:
          VIEWER_BUCKET: ${{ vars.GCP_VIEWER_BUCKET || format('{0}-viewer', vars.GCP_PROJECT_ID) }}
        run: |
          VIEWER_URL="https://${VIEWER_BUCKET}.storage.googleapis.com"
          HTTP_CODE=$(curl -sS -o /dev/null -w "%{http_code}" "${VIEWER_URL}/index.html")
          echo "Public viewer index.html -> HTTP ${HTTP_CODE}"
          test "${HTTP_CODE}" = "200"

          curl -fsS "${VIEWER_URL}/benchmark-manifest.json" \
            | VIEWER_URL="${VIEWER_URL}" python3 -c "import json,os,sys,urllib.request; d=json.load(sys.stdin); assert d.get('version') and d.get('commit_sha'), d; bundles=d.get('bundles') or {}; [urllib.request.urlopen(f\"{os.environ['VIEWER_URL']}/{p}\").close() for p in bundles.values()]; print('Viewer manifest OK:', d['version'][:12], 'mode:', d.get('mode', 'live_irsa'))"

  rollback:
    name: "Rollback Cloud Run Service"
    needs: [verify]
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'rollback' && (github.event.inputs.revision != '' || github.event.inputs.image_digest == '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ github.event.inputs.environment || 'staging' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via OIDC/WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - name: Rollback by revision
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          TARGET_REVISION: ${{ github.event.inputs.revision }}
          WORKER_REVISION: ${{ github.event.inputs.worker_revision }}
        run: |
          if [ -z "${TARGET_REVISION}" ]; then
            echo "::error::Provide an API revision or an image digest with its code SHA"
            exit 1
          fi
          if [ -n "${WORKER_REVISION}" ]; then
            gcloud run services update-traffic "${SERVICE_NAME}-worker" \
              --project "${PROJECT_ID}" --region "${REGION}" \
              --to-revisions="${WORKER_REVISION}=100"
          fi
          gcloud run services update-traffic "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" --region "${REGION}" \
            --to-revisions="${TARGET_REVISION}=100"

      - name: Verify post-rollback health
        env:
          SERVICE_NAME: ${{ vars.GCP_CLOUD_RUN_SERVICE }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          SERVICE_URL=$(gcloud run services describe "${SERVICE_NAME}" \
            --project "${PROJECT_ID}" \
            --region "${REGION}" \
            --format='value(status.url)')
          ID_TOKEN=$(gcloud auth print-identity-token \
            --impersonate-service-account="${DEPLOY_SA}" --audiences="${SERVICE_URL}")
          curl --fail --silent --show-error \
            -H "Authorization: Bearer ${ID_TOKEN}" \
            "${SERVICE_URL}/api/v1/health"
