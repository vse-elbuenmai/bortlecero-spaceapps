name: CI / Hosting (pull request)

on:
  pull_request:

permissions:
  contents: read

jobs:
  viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - run: python scripts/build_hosting.py
      - run: npm --prefix tests/browser ci
      - run: npx playwright install --with-deps chromium
        working-directory: tests/browser
      - run: npm --prefix tests/browser test
