name: "CI / build (push)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: "Package Build & CLI Verification"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Astral uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Build wheel and source distribution
        run: uv build

      - name: Verify CLI executable from virtual environment
        run: |
          uv sync --python 3.12
          uv run spherex-ingest --help
          uv run spherex-ingest list-benchmarks
