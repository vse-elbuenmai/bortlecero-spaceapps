apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  annotations:
    run.googleapis.com/invoker-iam-disabled: "false"
    run.googleapis.com/minScale: "0"
    run.googleapis.com/maxScale: "__MAX_INSTANCES__"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
    spec:
      serviceAccountName: __RUNTIME_SERVICE_ACCOUNT__
      containerConcurrency: __CONCURRENCY__
      timeoutSeconds: __TIMEOUT_SECONDS__
      containers:
        - image: __IMAGE_DIGEST__
          env:
            - name: SPHEREX_LEGACY_SYNC_ENABLED
              value: "false"
            - name: SPHEREX_ASYNC_JOBS_ENABLED
              value: "__SUBMISSIONS_ENABLED__"
            - name: SPHEREX_WORKER_ENABLED
              value: "__WORKER_ENABLED__"
            - name: SPHEREX_BENCHMARK_BUCKET
              value: "__BUNDLE_BUCKET__"
            - name: SPHEREX_RESULTS_BUCKET
              value: "__BUNDLE_BUCKET__"
            - name: SPHEREX_CODE_SHA
              value: "__CODE_SHA__"
            - name: SPHEREX_JOBS_BACKEND
              value: "firestore"
            - name: SPHEREX_JOB_MAX_ATTEMPTS
              value: "2"
            - name: SPHEREX_JOBS_DISPATCHER
              value: "cloud_tasks"
            - name: SPHEREX_TASKS_PROJECT
              value: "__PROJECT_ID__"
            - name: SPHEREX_TASKS_LOCATION
              value: "__REGION__"
            - name: SPHEREX_TASKS_QUEUE
              value: "__TASKS_QUEUE__"
            - name: SPHEREX_TASKS_SERVICE_ACCOUNT
              value: "__TASKS_SERVICE_ACCOUNT__"
            - name: SPHEREX_WORKER_BASE_URL
              value: "__WORKER_URL__"
            - name: SPHEREX_WORKER_OIDC_AUDIENCE
              value: "__WORKER_URL__"
            - name: SPHEREX_REQUIRE_CLOUD_TASKS_HEADER
              value: "true"
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: gemini-api-key
                  key: latest
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  traffic:
    - latestRevision: true
      percent: 100
