[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spherex-ingest"
version = "0.1.0"
description = "SOLID data ingestion and preprocessing pipeline for NASA SPHEREx multi-epoch blink comparator (Bortle Cero - NASA Space Apps 2026)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "Bortle Cero Team" }
]
dependencies = [
    "astropy>=6.1.0",
    "reproject>=0.14.0",
    "pyvo>=1.5.2",
    "astroquery>=0.4.7",
    "photutils>=1.13.0",
    "numpy>=2.0.0",
    "scipy>=1.14.0",
    "pydantic>=2.9.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pillow>=11.0.0",
    "httpx>=0.27.0",
    "matplotlib>=3.8.0",
    "google-cloud-storage>=3.0.0",
    "google-cloud-firestore>=2.21.0",
    "google-cloud-tasks>=2.18.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[project.scripts]
spherex-ingest = "spherex_ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spherex_ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
