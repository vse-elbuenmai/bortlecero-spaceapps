name: "CI / doc (push)"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  doc:
    name: "Documentation & Link Validation"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate documentation files and relative links
        run: python scripts/check_docs.py
