apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: __SERVICE_NAME__
  annotations:
    run.googleapis.com/invoker-iam-disabled: "false"
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "2"
        run.googleapis.com/execution-environment: gen2
    spec:
      serviceAccountName: __RUNTIME_SERVICE_ACCOUNT__
      containerConcurrency: 1
      timeoutSeconds: 300
      containers:
        - image: __IMAGE_DIGEST__
          env:
            - name: SPHEREX_LEGACY_SYNC_ENABLED
              value: "false"
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            timeoutSeconds: 2
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8080
            timeoutSeconds: 2
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - name: scratch
              mountPath: /scratch
      volumes:
        - name: scratch
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
  traffic:
    - latestRevision: true
      percent: 100
